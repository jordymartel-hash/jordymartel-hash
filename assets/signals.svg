  <circle cx="750.0" cy="121.5" r="3" fill="#00f0ff"/><circle cx="834.7" cy="176.1" r="3" fill="#00f0ff"/><circle cx="819.7" cy="265.2" r="3" fill="#00f0ff"/><circle cx="750.0" cy="298.6" r="3" fill="#00f0ff"/><circle cx="674.3" cy="268.7" r="3" fill="#00f0ff"/><circle cx="682.3" cy="185.9" r="3" fill="#00f0ff"/>
